<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit profile · Connectly</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/responsive.css"></head><body data-auth-required="true" data-page="profile"><header class="mobile-top" id="mobileTop"></header><div class="app-shell"><aside class="sidebar" id="leftbar"></aside><main class="main-feed"><section class="card page-card"><h1 class="page-title">Edit profile</h1><form id="editProfileForm"><div style="display:flex;align-items:center;gap:16px;margin-bottom:22px"><div id="editAvatar"></div><label class="btn btn-soft">Choose avatar<input type="file" name="avatar" id="avatarInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label></div><div class="form-control"><label>Full name</label><input class="input" name="fullName" maxlength="80" required><div class="field-error" data-error="fullName"></div></div><div class="form-control"><label>Username</label><input class="input" name="username" maxlength="24" required><div class="field-error" data-error="username"></div></div><div class="form-control"><label>Bio</label><textarea class="input" name="bio" maxlength="180" rows="4" placeholder="Tell people a little about yourself"></textarea><div class="small muted" id="bioCount">0 / 180</div></div><div style="display:flex;gap:10px"><button class="btn btn-primary" id="saveProfile" type="submit">Save changes</button><a class="btn btn-ghost" id="cancelEdit" href="/profile.html">Cancel</a></div></form></section></main><aside class="rightbar" id="rightbar"></aside></div><nav class="mobile-nav" id="mobileNav"></nav><script src="/js/api.js"></script><script src="/js/app.js"></script><script>
document.addEventListener('connectly:ready',({detail})=>{const u=detail.user,form=document.getElementById('editProfileForm');form.fullName.value=u.fullName;form.username.value=u.username;form.bio.value=u.bio||'';document.getElementById('bioCount').textContent=`${form.bio.value.length} / 180`;document.getElementById('editAvatar').innerHTML=avatar(u,'lg');document.getElementById('cancelEdit').href=`/profile.html?id=${u.id}`;form.bio.addEventListener('input',()=>document.getElementById('bioCount').textContent=`${form.bio.value.length} / 180`);document.getElementById('avatarInput').addEventListener('change',e=>{const f=e.target.files[0];if(f)document.getElementById('editAvatar').innerHTML=`<img class="avatar lg" src="${URL.createObjectURL(f)}" alt="Avatar preview">`});form.addEventListener('submit',async e=>{e.preventDefault();form.querySelectorAll('.field-error').forEach(x=>x.textContent='');const fd=new FormData();fd.append('fullName',form.fullName.value);fd.append('username',form.username.value);fd.append('bio',form.bio.value);if(document.getElementById('avatarInput').files[0])fd.append('avatar',document.getElementById('avatarInput').files[0]);const btn=document.getElementById('saveProfile');btn.disabled=true;btn.textContent='Saving…';try{const d=await API.request(`/users/${u.id}`,{method:'PUT',body:fd});toast(d.message,'success');setTimeout(()=>location.href=`/profile.html?id=${u.id}`,500)}catch(err){Object.entries(err.errors||{}).forEach(([k,v])=>{const out=form.querySelector(`[data-error="${k}"]`);if(out)out.textContent=v});toast(err.message,'error')}finally{btn.disabled=false;btn.textContent='Save changes'}})});
</script></body></html>
