<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post · Connectly</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/responsive.css"></head><body data-auth-required="true"><header class="mobile-top" id="mobileTop"></header><div class="app-shell"><aside class="sidebar" id="leftbar"></aside><main class="main-feed"><div class="feed-title" style="padding-left:4px"><div><h1>Post</h1><a class="small muted" href="/home.html">← Back to home</a></div></div><section id="postDetail"></section></main><aside class="rightbar" id="rightbar"></aside></div><nav class="mobile-nav" id="mobileNav"></nav><script src="/js/api.js"></script><script src="/js/app.js"></script><script src="/js/comments.js"></script><script src="/js/posts.js"></script><script>document.addEventListener('connectly:ready',async()=>{const id=new URLSearchParams(location.search).get('id'),out=document.getElementById('postDetail');if(!id){out.innerHTML='<div class="card empty-state">Post ID is missing.</div>';return}try{const d=await API.get(`/posts/${id}`);out.innerHTML=renderPost(d.post);const box=out.querySelector('.comments-box');toggleComments(id,box)}catch(e){out.innerHTML=`<div class="card empty-state">${escapeHTML(e.message)}</div>`}})</script></body></html>
