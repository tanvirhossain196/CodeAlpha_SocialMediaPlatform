<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications · Connectly</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/responsive.css"></head><body data-auth-required="true" data-page="notifications"><header class="mobile-top" id="mobileTop"></header><div class="app-shell"><aside class="sidebar" id="leftbar"></aside><main class="main-feed"><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:1px solid var(--border)"><h1 style="margin:0;font-size:1.5rem">Notifications</h1><button class="btn btn-soft" id="readAll">Mark all read</button></div><div id="notificationList"><div class="empty-state">Loading notifications…</div></div></section></main><aside class="rightbar" id="rightbar"></aside></div><nav class="mobile-nav" id="mobileNav"></nav><script src="/js/api.js"></script><script src="/js/app.js"></script><script>
function notificationText(n){return n.type==='follow'?'started following you':n.type==='like'?'liked your post':'commented on your post'}
async function loadNotifications(){try{const d=await API.get('/notifications');document.getElementById('notificationList').innerHTML=d.notifications.length?d.notifications.map(n=>`<a class="notification ${n.isRead?'':'unread'}" href="${n.type==='follow'?`/profile.html?id=${n.actor.id}`:`/post.html?id=${n.postId}`}" data-id="${n.id}">${avatar(n.actor)}<div class="grow"><strong>${escapeHTML(n.actor.fullName)}</strong> ${notificationText(n)}<div class="small muted">${timeAgo(n.createdAt)}</div></div>${n.isRead?'':'<span style="color:var(--primary)">●</span>'}</a>`).join(''):'<div class="empty-state"><div class="empty-icon">♡</div><strong>You’re all caught up</strong><p>New likes, comments and follows will appear here.</p></div>'}catch(e){document.getElementById('notificationList').innerHTML=`<div class="empty-state">${escapeHTML(e.message)}</div>`}}
document.addEventListener('connectly:ready',loadNotifications);document.addEventListener('click',async e=>{const item=e.target.closest('.notification');if(item)API.put(`/notifications/${item.dataset.id}/read`,{}).catch(()=>{});if(e.target.id==='readAll'){try{await API.put('/notifications/read-all',{});document.querySelectorAll('.notification').forEach(x=>x.classList.remove('unread'));toast('All notifications marked as read.','success')}catch(err){toast(err.message,'error')}}});
</script></body></html>
