<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connections · Connectly</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/responsive.css"></head><body data-auth-required="true" data-page="profile"><header class="mobile-top" id="mobileTop"></header><div class="app-shell"><aside class="sidebar" id="leftbar"></aside><main class="main-feed"><section class="card page-card"><div style="display:flex;align-items:center;gap:12px;margin-bottom:20px"><a class="icon-btn" href="javascript:history.back()">←</a><div><h1 id="connectionTitle" class="page-title" style="margin:0">Connections</h1><span class="small muted">People in this network</span></div></div><div id="connectionList" class="user-list"></div></section></main><aside class="rightbar" id="rightbar"></aside></div><nav class="mobile-nav" id="mobileNav"></nav><script src="/js/api.js"></script><script src="/js/app.js"></script><script src="/js/users.js"></script><script>document.addEventListener('connectly:ready',async()=>{const p=new URLSearchParams(location.search),id=p.get('id')||Connectly.user.id,mode=p.get('mode')==='following'?'following':'followers';document.getElementById('connectionTitle').textContent=mode==='followers'?'Followers':'Following';try{const d=await API.get(`/users/${id}/${mode}`);document.getElementById('connectionList').innerHTML=d.users.length?d.users.map(userRow).join(''):`<div class="empty-state">No ${mode} yet.</div>`}catch(e){document.getElementById('connectionList').innerHTML=`<div class="empty-state">${escapeHTML(e.message)}</div>`}})</script></body></html>
