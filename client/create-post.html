<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create post · Connectly</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/responsive.css"></head><body data-auth-required="true"><header class="mobile-top" id="mobileTop"></header><div class="app-shell"><aside class="sidebar" id="leftbar"></aside><main class="main-feed"><section class="card page-card"><h1 class="page-title">Create post</h1><form id="standaloneComposer"><textarea class="input" name="content" maxlength="500" rows="8" placeholder="What do you want to share?"></textarea><div id="standalonePreview" class="image-preview"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px"><label class="btn btn-soft">▧ Add image<input type="file" name="image" accept="image/*" hidden></label><div style="display:flex;gap:8px"><a class="btn btn-ghost" href="/home.html">Cancel</a><button class="btn btn-primary" type="submit">Post</button></div></div></form></section></main><aside class="rightbar" id="rightbar"></aside></div><nav class="mobile-nav" id="mobileNav"></nav><script src="/js/api.js"></script><script src="/js/app.js"></script><script>document.addEventListener('connectly:ready',()=>{const f=document.getElementById('standaloneComposer');f.image.addEventListener('change',()=>{if(f.image.files[0])document.getElementById('standalonePreview').innerHTML=`<img src="${URL.createObjectURL(f.image.files[0])}" alt="Preview">`});f.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(f);const b=f.querySelector('button[type=submit]');b.disabled=true;b.textContent='Posting…';try{const d=await API.request('/posts',{method:'POST',body:fd});toast(d.message,'success');location.href=`/post.html?id=${d.post.id}`}catch(err){toast(err.message,'error')}finally{b.disabled=false;b.textContent='Post'}})})</script></body></html>
